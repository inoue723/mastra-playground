services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mastra
      POSTGRES_USER: mastra
      POSTGRES_PASSWORD: mastra
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mastra -d mastra']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
